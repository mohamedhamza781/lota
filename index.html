<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>كيان</title>
    <!-- PWA: manifest ثابت للوحة التحكم (الداشبورد). صفحة شات العميل
         (WebChat.jsx) بتستبدل وسم <link rel="manifest"> هاد ديناميكياً
         بـmanifest خاص فيها (لكل منشأة) وقت ما تكون مفتوحة - بس هاد
         مش مشكلة عمليًا، لأنه /chat/:slug صفحة عامة تفتح بمتصفح/جلسة
         منفصلة تمامًا عن لوحة التحكم (المدير ما بيفتحها بنفس التاب). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A09" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="كيان" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* منع تكبير/تصغير الشاشة باللمس (pinch-zoom / double-tap zoom) -
         touch-action لحاله كافي لمعظم المتصفحات (أندرويد/كروم)، بس آيفون
         (سفاري) بتجاهل أحياناً user-scalable=no فوق لأسباب accessibility،
         فمنضيف كمان سكريبت صغير تحت يمنع حركة "القرص" (pinch) تحديداً */
      html,
      body {
        touch-action: manipulation;
        overscroll-behavior: none;
      }

      /* ============ Splash Screen ثابتة (بدون React) ============
         الهدف: تسكير الفجوة البيضاء الفاضية يلي كانت تبين لجزء من ثانية
         (أو أكتر على نت بطيء) بين لحظة فتح الصفحة ولحظة ما React يشتغل
         فعلياً ويرندر splash تبعه (شوف loadingInfo بـWelcomeScreen،
         WebChat.jsx). هاي الشاشة #app-splash بتظهر فوراً (HTML/CSS خالص،
         بدون انتظار جافاسكربت)، وبتختفي تلقائياً بـfade سلس أول ما
         #root يتعبى (شوف السكريبت تحت آخر الصفحة). على أي مسار غير
         /chat/:slug (لوحة التحكم مثلاً) بتنخفى فوراً بدون ما تبين إطلاقاً
         (شوف السكريبت المتزامن جنب الـmarkup تبعها). */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(135deg, #64748b 0%, #064e3b 100%);
        transition: opacity 0.35s ease;
      }
      #app-splash.app-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash-logo {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #app-splash-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #app-splash-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(255, 255, 255, 0.28);
        border-top-color: #fff;
        border-radius: 50%;
        animation: app-splash-spin 0.8s cubic-bezier(0.68, -0.3, 0.32, 1.3) infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div id="app-splash-logo"></div>
      <div id="app-splash-spinner"></div>
    </div>
    <script>
      // ⚡ يشتغل فوراً (متزامن) قبل ما أي شي تاني يترسم - عشان القرار (نبين
      // splash العميل ولا نخفيها فوراً) ياخذ قبل أول frame مرسوم بالكامل
      (function () {
        var splash = document.getElementById("app-splash");
        var match = window.location.pathname.match(/^\/chat\/([^/]+)/);
        if (!match) {
          // مش صفحة شات عميل (لوحة تحكم، تسجيل دخول...) - منخفيها فوراً
          // بدون أي fade، ما في داعي تبين إطلاقاً بغير شات الزبون
          splash.style.display = "none";
          return;
        }
        // منشرح: نفس مفتاح الكاش يلي WebChat.jsx بيخزّن فيه هوية المنشأة
        // (شوف brandCacheKey هناك) - لو العميل زار هاد الرابط قبل هيك،
        // منقدر نلوّن الـsplash بلون هوية المنشأة الحقيقي ونعرض شعارها من
        // أول لحظة (بدل التدرّج المحايد الافتراضي)
        try {
          var slug = decodeURIComponent(match[1]);
          var cached = localStorage.getItem("webchat_brand:" + slug);
          if (cached) {
            var brand = JSON.parse(cached);
            if (brand.menuPrimaryColor) {
              splash.style.background = brand.menuPrimaryColor;
            }
            // منعرض الشعار المخزّن بس لو رابط كامل (http/https) - الروابط
            // النسبية محتاجة أصل الباك إند (API_ORIGIN) يلي مش متاح هون
            // (متغيّر بيئة مبني جوا حزمة جافاسكربت، مش بالـHTML الخام)،
            // فبنسيبها للـsplash تبع React (بتوصل خلال أجزاء من الثانية على أي حال)
            if (brand.logoUrl && /^https?:\/\//.test(brand.logoUrl)) {
              var img = document.createElement("img");
              img.src = brand.logoUrl;
              img.alt = brand.name || "";
              document.getElementById("app-splash-logo").appendChild(img);
            }
          }
        } catch (e) {
          // تجاهل - أي خطأ هون (localStorage غير متاح، JSON فاسد...) وبنكمل
          // بالتدرّج المحايد الافتراضي، ما بيوقف أي شي
        }
      })();
    </script>
    <div id="root"></div>
    <script>
      // بتراقب #root لحد ما React يعبّيها بأول رندر فعلي (WelcomeScreen
      // تبعه بيبيّن splash مشابهة تماماً بنفس اللحظة)، وبعدها بتعمل fade
      // ناعم لهاي الـsplash الثابتة وتشيلها من الـDOM نهائياً - عشان
      // الانتقال بينهم يصير سلس بدون أي وميض أبيض بالنص
      (function () {
        var splash = document.getElementById("app-splash");
        if (!splash || splash.style.display === "none") return; // أصلاً مخفية (مش صفحة شات)

        function removeSplash() {
          splash.classList.add("app-splash-hide");
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }

        var root = document.getElementById("root");
        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            observer.disconnect();
            removeSplash();
          }
        });
        observer.observe(root, { childList: true });

        // شبكة أمان: لو لأي سبب React ما اشتغل (خطأ تحميل، نت مقطوع
        // بالكامل...)، ما منسيب العميل عالق وراء splash للأبد
        setTimeout(function () {
          observer.disconnect();
          removeSplash();
        }, 8000);
      })();
    </script>
    <script>
      // منع حركة "القرص" (pinch-zoom) على آيفون تحديداً - المتصفح بيتجاهل
      // أحياناً user-scalable=no بالـmeta tag فوق، فهاد fallback إضافي
      document.addEventListener("gesturestart", (e) => e.preventDefault());
      let lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        (e) => {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) e.preventDefault(); // منع double-tap zoom
          lastTouchEnd = now;
        },
        { passive: false }
      );
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
